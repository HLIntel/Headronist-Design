<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Headronist flow network</title>
<desc id="desc">Abstract flowing data ribbons and fine connected nodes on a deep navy field, with a clear dark center for foreground content.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset=".55" stop-color="#020a17"/><stop offset="1" stop-color="#061326"/></linearGradient>
 <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1d8ac2" stop-opacity=".04"/><stop offset=".35" stop-color="#3daee8" stop-opacity=".42"/><stop offset=".55" stop-color="#d3e8f8" stop-opacity=".52"/><stop offset=".8" stop-color="#087ebd" stop-opacity=".18"/><stop offset="1" stop-color="#2cb8e9" stop-opacity=".03"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#087ebd" stop-opacity=".25"/><stop offset="1" stop-color="#087ebd" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="nodeGlow"><feGaussianBlur stdDeviation="5"/></filter>
